<title>Visual Routine</title>
<style>
  :root{
    --bg:#eef2f6; --surface:#fff; --surface-2:#f6f9fb; --ink:#26333d; --ink-soft:#5c6b75;
    --line:#d9e2e8; --calm:#5b8ba0; --now:#e6a54c; --done:#6ba368; --danger:#c96a5f;
    --radius:22px; --shadow:0 6px 20px rgba(38,51,61,.10); --tap:72px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
    background:var(--bg);color:var(--ink);font-size:clamp(17px,2.4vw,22px);line-height:1.35;
    -webkit-user-select:none;user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:inherit}

  .app{max-width:1000px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;gap:10px}
  header .title{font-weight:700;font-size:1.15em}
  header .title span{color:var(--calm)}
  .header-btns{display:flex;gap:10px}
  .icon-btn{width:var(--tap);height:var(--tap);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-size:24px}
  .icon-btn.active{background:var(--calm);color:#fff}
  .icon-btn:active{transform:scale(.96)}
  .icon-btn.lang{font-size:16px;font-weight:700;color:var(--calm)}

  main{flex:1;padding:6px 16px 100px}
  .view{display:none}
  .view.on{display:block}

  .progress{display:flex;gap:10px;justify-content:center;padding:4px 0 16px;flex-wrap:wrap}
  .dot{width:16px;height:16px;border-radius:50%;background:var(--line)}
  .dot.done{background:var(--done)}
  .dot.now{background:var(--now);box-shadow:0 0 0 5px rgba(230,165,76,.22)}

  .list{display:flex;flex-direction:column;gap:14px}
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;align-items:center;gap:18px;padding:16px;position:relative;border:3px solid transparent;transition:border-color .2s,opacity .2s;min-height:118px}
  .card .pic{width:96px;height:96px;flex:0 0 96px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;font-size:52px}
  .card .pic img{width:100%;height:100%;object-fit:contain}
  .card .meta{flex:1;min-width:0}
  .card .label{font-weight:700;font-size:1.25em;line-height:1.2;word-break:break-word}
  .card .sub{color:var(--ink-soft);margin-top:4px;display:flex;align-items:center;gap:6px}
  .card .go{flex:0 0 auto;width:var(--tap);height:var(--tap);border-radius:20px;background:var(--calm);color:#fff;font-size:30px;display:grid;place-items:center;box-shadow:var(--shadow)}
  .card .go:active{transform:scale(.95)}
  .card.now{border-color:var(--now)}
  .card.done{opacity:.55}
  .card.done .go{background:var(--done)}
  .card .check{position:absolute;top:-10px;right:-10px;width:40px;height:40px;border-radius:50%;background:var(--done);color:#fff;display:none;place-items:center;font-size:22px;box-shadow:var(--shadow)}
  .card.done .check{display:grid}
  /* countdown badge on event cards */
  .card .count{flex:0 0 auto;min-width:84px;height:84px;border-radius:18px;background:var(--surface-2);display:grid;place-items:center;text-align:center;padding:6px;border:2px solid var(--line)}
  .card .count b{font-size:1.9em;line-height:1;color:var(--calm)}
  .card .count small{color:var(--ink-soft);font-size:.7em}
  .card .count.soon b{color:var(--now)}
  .card .count.today b{color:var(--done)}

  .card .edit-tools{display:none;flex-direction:column;gap:8px;flex:0 0 auto}
  body.editing .card .go,body.editing .card .count{display:none}
  body.editing .card .edit-tools{display:flex}
  body.editing .card{border-style:dashed;border-color:var(--line)}
  .mini{width:52px;height:52px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-size:22px;color:var(--ink-soft)}
  .mini.del{color:var(--danger)}
  .mini:active{transform:scale(.94)}

  .empty{text-align:center;color:var(--ink-soft);padding:56px 20px;background:var(--surface);border-radius:var(--radius);border:2px dashed var(--line)}
  .empty .big{font-size:56px;margin-bottom:10px}

  .addbar{display:none;position:sticky;bottom:96px;padding:14px 0 6px;background:linear-gradient(transparent,var(--bg) 40%)}
  body.editing .addbar{display:block}
  .addbtn{width:100%;height:64px;border-radius:20px;background:var(--calm);color:#fff;font-weight:700;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.05em}

  /* bottom tab bar */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:10px;max-width:1000px;margin:0 auto}
  .tabs button{flex:1;height:64px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-soft);font-size:.8em;font-weight:600}
  .tabs button .ic{font-size:26px}
  .tabs button.on{color:var(--calm);background:var(--surface-2)}

  /* install banner */
  .install{display:none;align-items:center;gap:12px;margin:0 16px 12px;padding:12px 14px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
  .install.show{display:flex}
  .install .txt{flex:1;font-size:.9em}
  .install button.go{height:52px;padding:0 20px;border-radius:14px;background:var(--calm);color:#fff;font-weight:700}
  .install button.x{width:44px;height:44px;border-radius:12px;color:var(--ink-soft);font-size:20px}

  /* modal sheet */
  .scrim{position:fixed;inset:0;background:rgba(38,51,61,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .scrim.open{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:640px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
  .sheet h2{margin:2px 0 14px;font-size:1.2em}
  .row{display:flex;gap:10px;margin-bottom:12px}
  .field{flex:1}
  .field label{display:block;font-size:.8em;color:var(--ink-soft);margin:0 0 6px 4px;font-weight:600}
  .field input,.field select{width:100%;height:58px;border-radius:16px;border:2px solid var(--line);background:var(--surface);padding:0 16px;color:var(--ink)}
  .field input:focus,.field select:focus{outline:none;border-color:var(--calm)}
  .seg{display:flex;gap:8px;margin-bottom:14px}
  .seg button{flex:1;height:56px;border-radius:14px;background:var(--surface);border:2px solid var(--line);color:var(--ink-soft);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
  .seg button.on{background:var(--calm);color:#fff;border-color:var(--calm)}
  .picsource{margin-bottom:14px}
  .searchrow{display:flex;gap:8px;margin-bottom:10px}
  .searchrow input{flex:1;height:58px;border-radius:16px;border:2px solid var(--line);background:var(--surface);padding:0 16px}
  .searchrow select{flex:0 0 96px;height:58px;border-radius:16px;border:2px solid var(--line);background:var(--surface);padding:0 12px}
  .searchrow button{width:58px;height:58px;border-radius:16px;background:var(--calm);color:#fff;font-size:24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;min-height:60px}
  .grid .thumb{aspect-ratio:1;background:var(--surface);border-radius:14px;border:2px solid var(--line);display:grid;place-items:center;overflow:hidden;padding:6px}
  .grid .thumb img{width:100%;height:100%;object-fit:contain}
  .grid .thumb.sel{border-color:var(--now);box-shadow:0 0 0 3px rgba(230,165,76,.3)}
  .hint{color:var(--ink-soft);font-size:.85em;text-align:center;padding:10px}
  .emojis{display:flex;flex-wrap:wrap;gap:8px}
  .emojis button{width:56px;height:56px;font-size:30px;border-radius:14px;background:var(--surface);border:2px solid var(--line)}
  .emojis button.sel{border-color:var(--now)}
  .sheet-actions{display:flex;gap:10px;margin-top:8px}
  .sheet-actions button{flex:1;height:62px;border-radius:16px;font-weight:700}
  .btn-primary{background:var(--calm);color:#fff}
  .btn-ghost{background:var(--surface);border:2px solid var(--line);color:var(--ink-soft)}
  .preview-pic{width:84px;height:84px;border-radius:16px;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;overflow:hidden;font-size:44px;flex:0 0 auto}
  .preview-pic img{width:100%;height:100%;object-fit:contain}

  /* timer overlay */
  .timer{position:fixed;inset:0;background:var(--surface);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;text-align:center}
  .timer.open{display:flex}
  .timer .t-label{font-size:1.6em;font-weight:700}
  .disc-wrap{position:relative;width:min(70vw,55vh);aspect-ratio:1}
  .disc{width:100%;height:100%;border-radius:50%;background:conic-gradient(var(--now) calc(var(--pct)*1%), var(--surface-2) 0);box-shadow:inset 0 0 0 10px var(--surface-2), var(--shadow)}
  .disc-center{position:absolute;inset:22%;border-radius:50%;background:var(--surface);display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 4px #fff, 0 4px 14px rgba(0,0,0,.08)}
  .disc-center img{width:66%;height:66%;object-fit:contain}
  .disc-center .emoji{font-size:16vh}
  .t-time{font-size:2.2em;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
  .t-actions{display:flex;gap:14px}
  .t-btn{height:70px;padding:0 26px;border-radius:20px;font-weight:700;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
  .t-btn.done{background:var(--done);color:#fff;font-size:1.15em;padding:0 40px}
  .t-btn.stop{background:var(--surface-2);color:var(--ink-soft)}
  .t-done-badge{font-size:64px;color:var(--done);display:none}
  .timer.finished .disc{background:var(--done)}
  .timer.finished .t-done-badge{display:block}
  .timer.finished .t-time{display:none}

  /* countdown detail overlay */
  .detail{position:fixed;inset:0;background:var(--bg);z-index:55;display:none;flex-direction:column}
  .detail.open{display:flex}
  .detail header{padding:14px 18px}
  .detail .body{flex:1;overflow:auto;padding:0 18px 30px;text-align:center}
  .d-pic{width:120px;height:120px;margin:6px auto 4px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;overflow:hidden;font-size:64px}
  .d-pic img{width:100%;height:100%;object-fit:contain}
  .d-name{font-weight:800;font-size:1.5em}
  .d-count{margin:14px 0 6px}
  .d-count .num{font-size:5em;font-weight:800;color:var(--calm);line-height:.9}
  .d-count.soon .num{color:var(--now)} .d-count.today .num{color:var(--done)}
  .d-count .word{color:var(--ink-soft);font-size:1.1em;margin-top:6px}
  .sleeps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px auto;max-width:520px}
  .sleeps span{font-size:26px;opacity:.85}
  .sleeps span.gone{opacity:.18}
  .stampbtn{height:64px;padding:0 30px;border-radius:20px;background:var(--now);color:#fff;font-weight:700;box-shadow:var(--shadow);margin:8px auto 20px;display:inline-flex;align-items:center;gap:10px}
  .stampbtn.disabled{background:var(--line);color:var(--ink-soft)}

  .cal{max-width:560px;margin:0 auto}
  .cal .month{margin-bottom:20px}
  .cal .m-title{font-weight:700;margin:0 0 8px;color:var(--calm)}
  .cal .wd,.cal .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal .wd div{font-size:.72em;color:var(--ink-soft);text-align:center;font-weight:600;padding-bottom:2px}
  .cal .day{aspect-ratio:1;background:var(--surface);border-radius:12px;display:grid;place-items:center;position:relative;font-weight:600;box-shadow:var(--shadow)}
  .cal .day.empty{background:transparent;box-shadow:none}
  .cal .day.past{color:var(--ink-soft)}
  .cal .day.marked::after{content:"✓";position:absolute;font-size:1.6em;color:var(--done)}
  .cal .day.marked{color:transparent}
  .cal .day.today{background:var(--now);color:#fff;box-shadow:0 0 0 4px rgba(230,165,76,.3)}
  .cal .day.event{background:var(--calm);color:#fff}
  .cal .day.event .evp{position:absolute;inset:8%;display:grid;place-items:center;font-size:1.4em;overflow:hidden}
  .cal .day.event .evp img{width:100%;height:100%;object-fit:contain}
  .cal .day.event .evn{position:absolute;top:2px;left:4px;font-size:.7em}

  @media (min-width:720px){.card .pic{width:120px;height:120px;flex-basis:120px;font-size:64px}.card .label{font-size:1.45em}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">Visual <span>Routine</span></div>
    <div class="header-btns">
      <button class="icon-btn lang" id="langBtn" title="Child language">PT</button>
      <button class="icon-btn" id="lockBtn" title="Child lock">🔒</button>
      <button class="icon-btn" id="editBtn" title="Edit">✏️</button>
    </div>
  </header>

  <div class="install" id="installBanner">
    <div class="txt" id="installText">Install this app on your tablet.</div>
    <button class="go" id="installBtn">Install</button>
    <button class="x" id="installClose">✕</button>
  </div>

  <main>
    <!-- ROUTINE -->
    <section class="view on" id="view-routine">
      <div class="progress" id="progress"></div>
      <div class="list" id="routine"></div>
      <div class="addbar"><button class="addbtn" id="addActivityBtn">＋ &nbsp;Add activity</button></div>
    </section>

    <!-- COUNTDOWN -->
    <section class="view" id="view-countdown">
      <div class="list" id="events"></div>
      <div class="addbar"><button class="addbtn" id="addEventBtn">＋ &nbsp;Add special day</button></div>
    </section>
  </main>
</div>

<!-- bottom tabs -->
<nav class="tabs">
  <button data-tab="routine" class="on"><span class="ic">🗓️</span>Routine</button>
  <button data-tab="countdown"><span class="ic">⭐</span>Countdown</button>
</nav>

<!-- Editor sheet (shared: activity | event) -->
<div class="scrim" id="sheet">
  <div class="sheet">
    <h2 id="sheetTitle">Add</h2>
    <div class="row" style="align-items:flex-end">
      <div class="preview-pic" id="previewPic"><span>🖼️</span></div>
      <div class="field" style="flex:1">
        <label>Name (any language)</label>
        <input id="labelInput" placeholder="e.g. Breakfast" autocomplete="off" />
      </div>
      <div class="field" id="minutesField" style="flex:0 0 110px">
        <label>Minutes</label>
        <input id="minutesInput" type="number" min="1" max="90" value="10" inputmode="numeric" />
      </div>
      <div class="field" id="dateField" style="flex:0 0 170px;display:none">
        <label>Date</label>
        <input id="dateInput" type="date" />
      </div>
    </div>

    <div class="seg" id="sourceSeg">
      <button data-src="arasaac" class="on">🔎 Pictogram</button>
      <button data-src="photo">📷 Photo</button>
      <button data-src="emoji">😀 Emoji</button>
    </div>

    <div class="picsource" id="src-arasaac">
      <div class="searchrow">
        <select id="localeSel">
          <option value="pt">PT</option><option value="en">EN</option>
          <option value="sv">SV</option><option value="es">ES</option>
        </select>
        <input id="searchInput" placeholder="Search a word…" autocomplete="off" />
        <button id="searchBtn">🔎</button>
      </div>
      <div class="grid" id="searchGrid"></div>
      <div class="hint" id="searchHint">Pictograms by ARASAAC (Sergio Palao · Gob. de Aragón · CC BY-NC-SA)</div>
    </div>
    <div class="picsource" id="src-photo" style="display:none">
      <input type="file" id="photoInput" accept="image/*" capture="environment" style="width:100%;padding:14px;background:var(--surface);border:2px dashed var(--line);border-radius:16px" />
      <div class="hint">Use a real photo of the child's own object, place or person.</div>
    </div>
    <div class="picsource" id="src-emoji" style="display:none"><div class="emojis" id="emojiGrid"></div></div>

    <div class="sheet-actions">
      <button class="btn-ghost" id="cancelBtn">Cancel</button>
      <button class="btn-primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<!-- Timer overlay -->
<div class="timer" id="timer">
  <div class="t-label" id="tLabel">Activity</div>
  <div class="disc-wrap"><div class="disc" id="disc" style="--pct:100"></div><div class="disc-center" id="discCenter"></div></div>
  <div class="t-done-badge">✓</div>
  <div class="t-time" id="tTime">10:00</div>
  <div class="t-actions">
    <button class="t-btn stop" id="tStop">✕ Stop</button>
    <button class="t-btn done" id="tDone">✓ Done</button>
  </div>
</div>

<!-- Countdown detail overlay -->
<div class="detail" id="detail">
  <header>
    <button class="icon-btn" id="detailBack">←</button>
  </header>
  <div class="body">
    <div class="d-pic" id="dPic"></div>
    <div class="d-name" id="dName"></div>
    <div class="d-count" id="dCount"><div class="num" id="dNum">0</div><div class="word" id="dWord"></div></div>
    <div class="sleeps" id="dSleeps"></div>
    <button class="stampbtn" id="stampBtn">✋ Mark today</button>
    <div class="cal" id="dCal"></div>
  </div>
</div>

<script>
"use strict";

/* ---------------- config ---------------- */
const ARASAAC_API = "https://api.arasaac.org/api/pictograms";
const ARASAAC_IMG = id => `https://static.arasaac.org/pictograms/${id}/${id}_300.png`;
const MS = 86400000;

/* child-facing strings (only these are translated; admin UI stays English) */
const STR = {
  pt:{ toGo:"Faltam", one:"Falta", days:"dias", day:"dia", today:"É hoje! 🎉", passed:"Já passou", stamp:"Marcar hoje",
       wd:["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"],
       mo:["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"] },
  sv:{ toGo:"", one:"", days:"dagar", day:"dag", today:"Idag! 🎉", passed:"Passerat", stamp:"Markera idag",
       wd:["Mån","Tis","Ons","Tor","Fre","Lör","Sön"],
       mo:["Januari","Februari","Mars","April","Maj","Juni","Juli","Augusti","September","Oktober","November","December"] },
  en:{ toGo:"", one:"", days:"days", day:"day", today:"Today! 🎉", passed:"Passed", stamp:"Mark today",
       wd:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
       mo:["January","February","March","April","May","June","July","August","September","October","November","December"] }
};
const LANGS = ["pt","en","sv"];

/* ---------------- storage (guarded) ---------------- */
const STORE_KEY = "visual-routine-v2";
let memoryFallback = null;
function loadState(){
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return memoryFallback;
}
function saveState(){
  memoryFallback = state;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
function uid(){ return Math.random().toString(36).slice(2,9); }

function seed(){
  return {
    settings:{ lang:"pt" },
    activities:[
      { id:uid(), label:"Wake up",    src:"emoji", img:"🛏️", minutes:5,  done:false },
      { id:uid(), label:"Breakfast",  src:"emoji", img:"🥣", minutes:15, done:false },
      { id:uid(), label:"Brush teeth",src:"emoji", img:"🪥", minutes:3,  done:false },
      { id:uid(), label:"Play",       src:"emoji", img:"🧸", minutes:20, done:false },
      { id:uid(), label:"Bath",       src:"emoji", img:"🛁", minutes:10, done:false }
    ],
    events:[]
  };
}
let state = loadState() || seed();
if(!state.settings) state.settings={lang:"pt"};
if(!state.events) state.events=[];

/* ---------------- date helpers ---------------- */
function isoOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayISO(){ return isoOf(new Date()); }
function parseISO(s){ const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); }
function daysUntil(iso){ return Math.round((parseISO(iso) - parseISO(todayISO()))/MS); }

/* ---------------- shorthand ---------------- */
const $ = s => document.querySelector(s);
function escapeHtml(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function T(){ return STR[state.settings.lang] || STR.pt; }

/* ---------------- language / lock / edit ---------------- */
const langBtn=$("#langBtn"), lockBtn=$("#lockBtn"), editBtn=$("#editBtn");
function applyLang(){ langBtn.textContent = state.settings.lang.toUpperCase(); renderAll(); }
langBtn.addEventListener("click",()=>{
  const i=LANGS.indexOf(state.settings.lang); state.settings.lang=LANGS[(i+1)%LANGS.length];
  saveState(); applyLang();
});
editBtn.addEventListener("click",()=>{ document.body.classList.toggle("editing"); editBtn.classList.toggle("active"); });
lockBtn.addEventListener("click",()=>{
  const locked=document.body.classList.toggle("locked");
  lockBtn.textContent=locked?"🔓":"🔒"; editBtn.style.display=locked?"none":"";
  if(locked){ document.body.classList.remove("editing"); editBtn.classList.remove("active"); }
});
let lockTimer=null;
lockBtn.addEventListener("pointerdown",()=>{ if(!document.body.classList.contains("locked"))return;
  lockTimer=setTimeout(()=>{ document.body.classList.remove("locked"); lockBtn.textContent="🔒"; editBtn.style.display=""; },900); });
["pointerup","pointerleave","pointercancel"].forEach(ev=>lockBtn.addEventListener(ev,()=>clearTimeout(lockTimer)));

/* ---------------- tabs ---------------- */
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  const tab=b.dataset.tab;
  $("#view-routine").classList.toggle("on",tab==="routine");
  $("#view-countdown").classList.toggle("on",tab==="countdown");
}));

/* ============================================================
   ROUTINE
============================================================ */
const routineEl=$("#routine"), progressEl=$("#progress");
function picMarkup(a){ return a.src==="emoji" ? `<span>${a.img||"🖼️"}</span>`
  : `<img alt="" src="${a.img}" onerror="this.replaceWith(document.createTextNode('🖼️'))">`; }
function currentIndex(){ return state.activities.findIndex(a=>!a.done); }
function renderRoutine(){
  const cur=currentIndex(); routineEl.innerHTML="";
  if(!state.activities.length){ routineEl.innerHTML=`<div class="empty"><div class="big">🗓️</div>No activities yet.<br>Tap ✏️, then “Add activity”.</div>`; }
  state.activities.forEach((a,i)=>{
    const card=document.createElement("div");
    card.className="card"+(a.done?" done":"")+(i===cur?" now":"");
    card.innerHTML=`
      <div class="pic">${picMarkup(a)}</div>
      <div class="meta"><div class="label">${escapeHtml(a.label||"Activity")}</div><div class="sub">⏱️ ${a.minutes} min</div></div>
      <button class="go" aria-label="Start">▶</button>
      <div class="edit-tools"><button class="mini up">▲</button><button class="mini down">▼</button><button class="mini del">🗑️</button></div>
      <div class="check">✓</div>`;
    card.querySelector(".go").addEventListener("click",()=>startTimer(a));
    card.querySelector(".up").addEventListener("click",()=>moveA(i,-1));
    card.querySelector(".down").addEventListener("click",()=>moveA(i,1));
    card.querySelector(".del").addEventListener("click",()=>{state.activities.splice(i,1);saveState();renderRoutine();});
    const openEdit=()=>{ if(document.body.classList.contains("editing")) openSheet("activity",i); };
    card.querySelector(".meta").addEventListener("click",openEdit);
    card.querySelector(".pic").addEventListener("click",openEdit);
    routineEl.appendChild(card);
  });
  progressEl.innerHTML="";
  state.activities.forEach((a,i)=>{ const d=document.createElement("div");
    d.className="dot"+(a.done?" done":(i===cur?" now":"")); progressEl.appendChild(d); });
}
function moveA(i,dir){ const j=i+dir; if(j<0||j>=state.activities.length)return;
  const a=state.activities;[a[i],a[j]]=[a[j],a[i]];saveState();renderRoutine(); }

/* ============================================================
   COUNTDOWN (events)
============================================================ */
const eventsEl=$("#events");
function renderEvents(){
  eventsEl.innerHTML="";
  if(!state.events.length){ eventsEl.innerHTML=`<div class="empty"><div class="big">⭐</div>No special days yet.<br>Tap ✏️, then “Add special day”.</div>`; }
  // sort by soonest
  const sorted=[...state.events].sort((x,y)=>parseISO(x.date)-parseISO(y.date));
  sorted.forEach(ev=>{
    const i=state.events.indexOf(ev);
    const rem=daysUntil(ev.date);
    const card=document.createElement("div"); card.className="card";
    const cls = rem<=0 ? "today" : (rem<=3 ? "soon" : "");
    const badge = rem>0 ? `<b>${rem}</b><small>${rem===1?T().day:T().days}</small>` : (rem===0?`<b>🎉</b>`:`<b>·</b><small>${T().passed}</small>`);
    card.innerHTML=`
      <div class="pic">${picMarkup(ev)}</div>
      <div class="meta"><div class="label">${escapeHtml(ev.name||"Special day")}</div><div class="sub">📅 ${ev.date}</div></div>
      <div class="count ${cls}">${badge}</div>
      <div class="edit-tools"><button class="mini ed">✏️</button><button class="mini del">🗑️</button></div>`;
    card.querySelector(".pic").addEventListener("click",()=>document.body.classList.contains("editing")?openSheet("event",i):openDetail(ev));
    card.querySelector(".meta").addEventListener("click",()=>document.body.classList.contains("editing")?openSheet("event",i):openDetail(ev));
    card.querySelector(".count").addEventListener("click",()=>openDetail(ev));
    card.querySelector(".ed").addEventListener("click",()=>openSheet("event",i));
    card.querySelector(".del").addEventListener("click",()=>{state.events.splice(i,1);saveState();renderEvents();});
    eventsEl.appendChild(card);
  });
}

/* ---- detail overlay ---- */
const detail=$("#detail");
let detailEvent=null;
function openDetail(ev){ detailEvent=ev; renderDetail(); detail.classList.add("open"); }
$("#detailBack").addEventListener("click",()=>{ detail.classList.remove("open"); detailEvent=null; });
$("#stampBtn").addEventListener("click",()=>{
  if(!detailEvent)return; const t=todayISO();
  detailEvent.marked=detailEvent.marked||[];
  if(!detailEvent.marked.includes(t)) detailEvent.marked.push(t);
  saveState(); renderDetail(); renderEvents();
});
function renderDetail(){
  const ev=detailEvent; if(!ev)return;
  $("#dPic").innerHTML = ev.src==="emoji"?`<span>${ev.img}</span>`:`<img alt="" src="${ev.img}">`;
  $("#dName").textContent = ev.name||"";
  const rem=daysUntil(ev.date);
  const dc=$("#dCount"); dc.className="d-count"+(rem<=0?" today":(rem<=3?" soon":""));
  if(rem>0){ $("#dNum").textContent=rem; $("#dNum").style.display="";
    $("#dWord").textContent = `${(rem===1?T().one:T().toGo)} ${rem===1?T().day:T().days}`.trim(); }
  else if(rem===0){ $("#dNum").style.display="none"; $("#dWord").textContent=T().today; }
  else { $("#dNum").style.display="none"; $("#dWord").textContent=T().passed; }
  // sleeps row (nights left)
  const sl=$("#dSleeps"); sl.innerHTML="";
  const n=Math.max(0,Math.min(rem,60));
  for(let i=0;i<n;i++){ const s=document.createElement("span"); s.textContent="🌙"; sl.appendChild(s); }
  // stamp button state
  const stamped=(ev.marked||[]).includes(todayISO());
  const sb=$("#stampBtn"); sb.textContent = "✋ "+T().stamp;
  sb.classList.toggle("disabled", stamped || rem<0);
  sb.style.display = rem<0 ? "none" : "";
  renderCalendar(ev);
}
function renderCalendar(ev){
  const wrap=$("#dCal"); wrap.innerHTML="";
  const today=parseISO(todayISO()), target=parseISO(ev.date);
  const start=new Date(Math.min(today,target)); start.setDate(1);
  const end=new Date(Math.max(today,target));
  let cur=new Date(start.getFullYear(),start.getMonth(),1);
  const marked=new Set(ev.marked||[]);
  while(cur<=end){
    const y=cur.getFullYear(), m=cur.getMonth();
    const month=document.createElement("div"); month.className="month";
    month.innerHTML=`<div class="m-title">${T().mo[m]} ${y}</div>
      <div class="wd">${T().wd.map(w=>`<div>${w}</div>`).join("")}</div>`;
    const days=document.createElement("div"); days.className="days";
    const first=new Date(y,m,1);
    const lead=(first.getDay()+6)%7; // Monday-first
    for(let i=0;i<lead;i++){ const e=document.createElement("div"); e.className="day empty"; days.appendChild(e); }
    const dim=new Date(y,m+1,0).getDate();
    for(let d=1;d<=dim;d++){
      const cell=new Date(y,m,d); const iso=isoOf(cell);
      const el=document.createElement("div"); el.className="day"; el.textContent=d;
      const diff=Math.round((cell-today)/MS);
      if(iso===ev.date){ el.className="day event";
        el.innerHTML=`<span class="evn">${d}</span><span class="evp">${ev.src==="emoji"?ev.img:`<img alt="" src="${ev.img}">`}</span>`; }
      else if(iso===todayISO()){ el.className="day today"; el.textContent=d;
        el.addEventListener("click",()=>{ marked.add(iso); ev.marked=[...marked]; saveState(); renderDetail(); renderEvents(); }); }
      else if(marked.has(iso) || diff<0){ el.className="day past"+(marked.has(iso)?" marked":""); }
      days.appendChild(el);
    }
    month.appendChild(days); wrap.appendChild(month);
    cur=new Date(y,m+1,1);
  }
}

/* ============================================================
   EDITOR SHEET (activity | event)
============================================================ */
const sheet=$("#sheet"), sheetTitle=$("#sheetTitle");
const labelInput=$("#labelInput"), minutesInput=$("#minutesInput"), dateInput=$("#dateInput"), previewPic=$("#previewPic");
let editMode="activity", editingIndex=-1, draft={src:"arasaac",img:null};
const EMOJIS=["🛏️","🥣","🍎","🪥","👕","🚽","🛁","🧸","📚","✏️","🚗","✈️","🏖️","🎂","🎁","🎄","🏫","🎨","⚽","🧩","🎵","🍽️","💤","🚿","☀️","🌙","👟","🍌","🥛","🖥️"];

function openSheet(mode,index){
  editMode=mode; editingIndex=(typeof index==="number")?index:-1;
  $("#minutesField").style.display = mode==="activity"?"":"none";
  $("#dateField").style.display    = mode==="event"?"":"none";
  if(editingIndex>=0){
    const it = mode==="activity"?state.activities[editingIndex]:state.events[editingIndex];
    sheetTitle.textContent = mode==="activity"?"Edit activity":"Edit special day";
    labelInput.value = mode==="activity"?it.label:it.name;
    if(mode==="activity") minutesInput.value=it.minutes; else dateInput.value=it.date;
    draft={src:it.src,img:it.img};
  }else{
    sheetTitle.textContent = mode==="activity"?"Add activity":"Add special day";
    labelInput.value=""; minutesInput.value=10;
    dateInput.value=""; draft={src:"emoji",img:null};
  }
  labelInput.placeholder = mode==="activity"?"e.g. Breakfast":"e.g. Trip to grandma";
  setSource(draft.src||"arasaac"); updatePreview();
  $("#searchGrid").innerHTML=""; $("#searchInput").value=""; buildEmojiGrid();
  sheet.classList.add("open");
}
function closeSheet(){ sheet.classList.remove("open"); }
$("#addActivityBtn").addEventListener("click",()=>openSheet("activity"));
$("#addEventBtn").addEventListener("click",()=>openSheet("event"));
$("#cancelBtn").addEventListener("click",closeSheet);
sheet.addEventListener("click",e=>{ if(e.target===sheet) closeSheet(); });

$("#sourceSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) setSource(b.dataset.src); });
function setSource(src){ draft.src=src;
  [...$("#sourceSeg").children].forEach(b=>b.classList.toggle("on",b.dataset.src===src));
  $("#src-arasaac").style.display=src==="arasaac"?"":"none";
  $("#src-photo").style.display=src==="photo"?"":"none";
  $("#src-emoji").style.display=src==="emoji"?"":"none";
}
function updatePreview(){
  if(draft.src==="emoji") previewPic.innerHTML=`<span>${draft.img||"😀"}</span>`;
  else if(draft.img) previewPic.innerHTML=`<img alt="" src="${draft.img}">`;
  else previewPic.innerHTML=`<span>🖼️</span>`;
}
function buildEmojiGrid(){ const g=$("#emojiGrid"); g.innerHTML="";
  EMOJIS.forEach(e=>{ const b=document.createElement("button"); b.textContent=e;
    if(draft.src==="emoji"&&draft.img===e) b.classList.add("sel");
    b.addEventListener("click",()=>{ draft.src="emoji"; draft.img=e;
      [...g.children].forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); updatePreview(); });
    g.appendChild(b); });
}
$("#photoInput").addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=()=>{ draft.src="photo"; draft.img=r.result; updatePreview(); }; r.readAsDataURL(f); });
function downscaleAsync(dataUrl,max=400){ return new Promise(res=>{ const img=new Image();
  img.onload=()=>{ const scale=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=img.width*scale; c.height=img.height*scale;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    try{res(c.toDataURL("image/jpeg",0.8));}catch(e){res(dataUrl);} };
  img.onerror=()=>res(dataUrl); img.src=dataUrl; }); }

/* ARASAAC search */
$("#searchBtn").addEventListener("click",doSearch);
$("#searchInput").addEventListener("keydown",e=>{ if(e.key==="Enter") doSearch(); });
async function doSearch(){
  const q=$("#searchInput").value.trim(); if(!q)return;
  const locale=$("#localeSel").value, grid=$("#searchGrid"), hint=$("#searchHint");
  grid.innerHTML=""; hint.textContent="Searching…";
  try{
    const r=await fetch(`${ARASAAC_API}/${locale}/search/${encodeURIComponent(q)}`);
    if(!r.ok) throw 0;
    const data=await r.json();
    if(!Array.isArray(data)||!data.length){ hint.textContent="No pictograms found. Try another word."; return; }
    hint.textContent="Pictograms by ARASAAC · CC BY-NC-SA";
    data.slice(0,24).forEach(p=>{ const id=p._id||p.id;
      const t=document.createElement("div"); t.className="thumb";
      t.innerHTML=`<img alt="" loading="lazy" src="${ARASAAC_IMG(id)}">`;
      t.addEventListener("click",async()=>{
        [...grid.children].forEach(x=>x.classList.remove("sel")); t.classList.add("sel");
        hint.textContent="Loading picture…";
        const dataUrl=await urlToDataUrl(ARASAAC_IMG(id));
        draft.src="arasaac"; draft.img=dataUrl||ARASAAC_IMG(id); updatePreview();
        if(!labelInput.value) labelInput.value=q; hint.textContent="Picture selected ✓";
      });
      grid.appendChild(t);
    });
  }catch(e){ hint.textContent="Search failed (offline?). Check connection and try again."; }
}
async function urlToDataUrl(url){ try{ const r=await fetch(url,{mode:"cors"}); const b=await r.blob();
  return await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>res(null); fr.readAsDataURL(b); }); }
  catch(e){ return null; } }

/* save */
$("#saveBtn").addEventListener("click",async()=>{
  let img=draft.img, src=draft.src;
  if(src==="photo"&&img&&img.startsWith("data:")) img=await downscaleAsync(img);
  if(!img){ src="emoji"; img="🖼️"; }
  if(editMode==="activity"){
    const label=labelInput.value.trim()||"Activity";
    const minutes=Math.max(1,Math.min(90,parseInt(minutesInput.value,10)||10));
    if(editingIndex>=0) Object.assign(state.activities[editingIndex],{label,minutes,src,img});
    else state.activities.push({id:uid(),label,minutes,src,img,done:false});
    renderRoutine();
  }else{
    const name=labelInput.value.trim()||"Special day";
    const date=dateInput.value||todayISO();
    if(editingIndex>=0) Object.assign(state.events[editingIndex],{name,date,src,img});
    else state.events.push({id:uid(),name,date,src,img,marked:[]});
    renderEvents();
  }
  saveState(); closeSheet();
});

/* ============================================================
   TIMER
============================================================ */
const timerEl=$("#timer"), disc=$("#disc"), discCenter=$("#discCenter"), tLabel=$("#tLabel"), tTime=$("#tTime");
let raf=null, activeActivity=null, endAt=0, totalMs=0, audioCtx=null;
function startTimer(a){ activeActivity=a; totalMs=a.minutes*60*1000; endAt=Date.now()+totalMs;
  tLabel.textContent=a.label;
  discCenter.innerHTML = a.src==="emoji"?`<span class="emoji">${a.img}</span>`:`<img alt="" src="${a.img}">`;
  timerEl.classList.remove("finished"); timerEl.classList.add("open"); loop(); }
function loop(){ const remain=Math.max(0,endAt-Date.now());
  disc.style.setProperty("--pct",(totalMs>0?remain/totalMs*100:0).toFixed(2));
  tTime.textContent=fmt(remain);
  if(remain<=0){ finishTimer(); return; } raf=requestAnimationFrame(loop); }
function fmt(ms){ const s=Math.round(ms/1000),m=Math.floor(s/60),ss=s%60; return `${m}:${String(ss).padStart(2,"0")}`; }
function finishTimer(){ cancelAnimationFrame(raf); timerEl.classList.add("finished"); disc.style.setProperty("--pct",100); chime(); }
function stopTimer(){ cancelAnimationFrame(raf); timerEl.classList.remove("open","finished"); activeActivity=null; }
$("#tStop").addEventListener("click",stopTimer);
$("#tDone").addEventListener("click",()=>{
  if(activeActivity) activeActivity.done=true; saveState(); renderRoutine(); stopTimer();
  if(state.activities.length && state.activities.every(a=>a.done)){
    setTimeout(()=>{ if(confirm("All done! 🎉  Start again?")){ state.activities.forEach(a=>a.done=false); saveState(); renderRoutine(); } },400);
  }
});
function chime(){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  [523.25,659.25,783.99].forEach((f,i)=>{ const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type="sine"; o.frequency.value=f; const t=audioCtx.currentTime+i*0.18;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.25,t+0.03); g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.55); }); }catch(e){} }

/* ============================================================
   PWA install
============================================================ */
/* single-file build: no external service worker */
(function(){
  const manifest = {

const banner=$("#installBanner"); let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredPrompt=e;
  $("#installText").textContent="Install this app on your tablet."; banner.classList.add("show"); });
$("#installBtn").addEventListener("click",async()=>{
  if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; banner.classList.remove("show"); }
});
$("#installClose").addEventListener("click",()=>banner.classList.remove("show"));
window.addEventListener("appinstalled",()=>banner.classList.remove("show"));
// iOS has no install prompt: show a hint instead
(function(){ const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone=window.navigator.standalone===true||window.matchMedia("(display-mode: standalone)").matches;
  if(isIOS && !standalone){ $("#installBtn").style.display="none";
    $("#installText").innerHTML="To install: tap <b>Share ▸ Add to Home Screen</b>."; banner.classList.add("show"); }
})();
