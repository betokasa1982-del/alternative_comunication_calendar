<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#eef2f6" />
<title>Visual Routine</title>
<style>
  /* ------------------------------------------------------------------
     Design tokens.
     Calm, low-saturation, autism-friendly palette. High contrast text,
     large touch targets (>= 64px), minimal clutter, one job per screen.
  ------------------------------------------------------------------ */
  :root{
    --bg:#eef2f6;            /* soft desaturated blue-grey */
    --surface:#ffffff;
    --surface-2:#f6f9fb;
    --ink:#26333d;           /* slate, not pure black (softer) */
    --ink-soft:#5c6b75;
    --line:#d9e2e8;
    --calm:#5b8ba0;          /* structure / primary */
    --now:#e6a54c;           /* current activity + timer wedge (warm, not alarming) */
    --done:#6ba368;          /* completed */
    --danger:#c96a5f;
    --radius:22px;
    --shadow:0 6px 20px rgba(38,51,61,.10);
    --tap:72px;              /* minimum comfortable target */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
    background:var(--bg);color:var(--ink);
    font-size:clamp(17px,2.4vw,22px);line-height:1.35;
    -webkit-user-select:none;user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:inherit}

  /* ---------- App shell ---------- */
  .app{max-width:1000px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;gap:12px;
  }
  header .title{font-weight:700;font-size:1.15em;letter-spacing:.2px}
  header .title span{color:var(--calm)}
  .header-btns{display:flex;gap:10px}
  .icon-btn{
    width:var(--tap);height:var(--tap);border-radius:18px;background:var(--surface);
    box-shadow:var(--shadow);display:grid;place-items:center;font-size:26px;
  }
  .icon-btn.active{background:var(--calm);color:#fff}
  .icon-btn:active{transform:scale(.96)}

  main{flex:1;padding:6px 16px 28px}

  /* ---------- Progress dots ---------- */
  .progress{display:flex;gap:10px;justify-content:center;padding:4px 0 16px;flex-wrap:wrap}
  .dot{width:16px;height:16px;border-radius:50%;background:var(--line)}
  .dot.done{background:var(--done)}
  .dot.now{background:var(--now);box-shadow:0 0 0 5px rgba(230,165,76,.22)}

  /* ---------- Routine list (child view) ---------- */
  .routine{display:flex;flex-direction:column;gap:14px}
  .card{
    background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    display:flex;align-items:center;gap:18px;padding:16px;position:relative;
    border:3px solid transparent;transition:border-color .2s,opacity .2s;
    min-height:118px;
  }
  .card .pic{
    width:96px;height:96px;flex:0 0 96px;border-radius:16px;background:var(--surface-2);
    display:grid;place-items:center;overflow:hidden;font-size:52px;
  }
  .card .pic img{width:100%;height:100%;object-fit:contain}
  .card .meta{flex:1;min-width:0}
  .card .label{font-weight:700;font-size:1.25em;line-height:1.2;word-break:break-word}
  .card .sub{color:var(--ink-soft);margin-top:4px;display:flex;align-items:center;gap:6px}
  .card .go{
    flex:0 0 auto;width:var(--tap);height:var(--tap);border-radius:20px;
    background:var(--calm);color:#fff;font-size:30px;display:grid;place-items:center;box-shadow:var(--shadow);
  }
  .card .go:active{transform:scale(.95)}
  .card.now{border-color:var(--now)}
  .card.done{opacity:.55}
  .card.done .go{background:var(--done)}
  .card .check{
    position:absolute;top:-10px;right:-10px;width:40px;height:40px;border-radius:50%;
    background:var(--done);color:#fff;display:none;place-items:center;font-size:22px;box-shadow:var(--shadow);
  }
  .card.done .check{display:grid}

  /* edit affordances on card */
  .card .edit-tools{display:none;flex-direction:column;gap:8px;flex:0 0 auto}
  body.editing .card .go{display:none}
  body.editing .card .edit-tools{display:flex}
  body.editing .card{border-style:dashed;border-color:var(--line)}
  .mini{
    width:52px;height:52px;border-radius:14px;background:var(--surface-2);
    display:grid;place-items:center;font-size:22px;color:var(--ink-soft)
  }
  .mini.del{color:var(--danger)}
  .mini:active{transform:scale(.94)}

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center;color:var(--ink-soft);padding:60px 20px;
    background:var(--surface);border-radius:var(--radius);border:2px dashed var(--line);
  }
  .empty .big{font-size:56px;margin-bottom:10px}

  /* ---------- Add / editor bar ---------- */
  .addbar{display:none;position:sticky;bottom:0;padding:14px 0 6px;background:linear-gradient(transparent,var(--bg) 40%)}
  body.editing .addbar{display:block}
  .addbtn{
    width:100%;height:64px;border-radius:20px;background:var(--calm);color:#fff;font-weight:700;
    box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.05em
  }

  /* ---------- Modal ---------- */
  .scrim{
    position:fixed;inset:0;background:rgba(38,51,61,.45);display:none;
    align-items:flex-end;justify-content:center;z-index:40;padding:0;
  }
  .scrim.open{display:flex}
  .sheet{
    background:var(--bg);width:100%;max-width:640px;border-radius:26px 26px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto;
    box-shadow:0 -10px 40px rgba(0,0,0,.2)
  }
  .sheet h2{margin:2px 0 14px;font-size:1.2em}
  .row{display:flex;gap:10px;margin-bottom:12px}
  .field{flex:1}
  .field label{display:block;font-size:.8em;color:var(--ink-soft);margin:0 0 6px 4px;font-weight:600}
  .field input,.field select{
    width:100%;height:58px;border-radius:16px;border:2px solid var(--line);background:var(--surface);
    padding:0 16px;color:var(--ink)
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--calm)}

  .seg{display:flex;gap:8px;margin-bottom:14px}
  .seg button{
    flex:1;height:56px;border-radius:14px;background:var(--surface);border:2px solid var(--line);
    color:var(--ink-soft);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px
  }
  .seg button.on{background:var(--calm);color:#fff;border-color:var(--calm)}

  .picsource{margin-bottom:14px}
  .searchrow{display:flex;gap:8px;margin-bottom:10px}
  .searchrow input{flex:1}
  .searchrow button{width:58px;height:58px;border-radius:16px;background:var(--calm);color:#fff;font-size:24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;min-height:60px}
  .grid .thumb{
    aspect-ratio:1;background:var(--surface);border-radius:14px;border:2px solid var(--line);
    display:grid;place-items:center;overflow:hidden;padding:6px
  }
  .grid .thumb img{width:100%;height:100%;object-fit:contain}
  .grid .thumb.sel{border-color:var(--now);box-shadow:0 0 0 3px rgba(230,165,76,.3)}
  .hint{color:var(--ink-soft);font-size:.85em;text-align:center;padding:10px}
  .emojis{display:flex;flex-wrap:wrap;gap:8px}
  .emojis button{width:56px;height:56px;font-size:30px;border-radius:14px;background:var(--surface);border:2px solid var(--line)}
  .emojis button.sel{border-color:var(--now)}

  .sheet-actions{display:flex;gap:10px;margin-top:8px}
  .sheet-actions button{flex:1;height:62px;border-radius:16px;font-weight:700}
  .btn-primary{background:var(--calm);color:#fff}
  .btn-ghost{background:var(--surface);border:2px solid var(--line);color:var(--ink-soft)}
  .preview-pic{
    width:84px;height:84px;border-radius:16px;background:var(--surface);border:2px solid var(--line);
    display:grid;place-items:center;overflow:hidden;font-size:44px;flex:0 0 auto
  }
  .preview-pic img{width:100%;height:100%;object-fit:contain}

  /* ---------- Timer overlay (the concrete visual timer) ---------- */
  .timer{
    position:fixed;inset:0;background:var(--surface);z-index:60;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:24px;
    padding:24px;text-align:center
  }
  .timer.open{display:flex}
  .timer .t-label{font-size:1.6em;font-weight:700}
  .disc-wrap{position:relative;width:min(70vw,60vh);aspect-ratio:1}
  .disc{
    width:100%;height:100%;border-radius:50%;
    /* the emptying wedge: solid --now shrinks clockwise as --pct goes 100 -> 0 */
    background:conic-gradient(var(--now) calc(var(--pct)*1%), var(--surface-2) 0);
    box-shadow:inset 0 0 0 10px var(--surface-2), var(--shadow);
  }
  .disc-center{
    position:absolute;inset:22%;border-radius:50%;background:var(--surface);
    display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 4px #fff, 0 4px 14px rgba(0,0,0,.08)
  }
  .disc-center img{width:66%;height:66%;object-fit:contain}
  .disc-center .emoji{font-size:22vw}
  .t-time{font-size:2.2em;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
  .t-time.hidden{visibility:hidden}
  .t-actions{display:flex;gap:14px}
  .t-btn{height:70px;padding:0 26px;border-radius:20px;font-weight:700;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
  .t-btn.done{background:var(--done);color:#fff;font-size:1.15em;padding:0 40px}
  .t-btn.stop{background:var(--surface-2);color:var(--ink-soft)}
  .t-done-badge{font-size:64px;color:var(--done);display:none}
  .timer.finished .disc{background:var(--done)}
  .timer.finished .t-done-badge{display:block}
  .timer.finished .t-time{display:none}

  @media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
  @media (min-width:720px){
    .card .pic{width:120px;height:120px;flex-basis:120px;font-size:64px}
    .card .label{font-size:1.45em}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">Visual <span>Routine</span></div>
    <div class="header-btns">
      <button class="icon-btn" id="lockBtn" title="Child lock">🔒</button>
      <button class="icon-btn" id="editBtn" title="Edit routine">✏️</button>
    </div>
  </header>

  <main>
    <div class="progress" id="progress"></div>
    <div class="routine" id="routine"></div>
    <div class="addbar">
      <button class="addbtn" id="addBtn">＋ &nbsp;Add activity</button>
    </div>
  </main>
</div>

<!-- ---------- Add / Edit sheet ---------- -->
<div class="scrim" id="sheet">
  <div class="sheet">
    <h2 id="sheetTitle">Add activity</h2>

    <div class="row" style="align-items:flex-end">
      <div class="preview-pic" id="previewPic"><span>🖼️</span></div>
      <div class="field" style="flex:1">
        <label>Name (any language)</label>
        <input id="labelInput" placeholder="e.g. Breakfast" autocomplete="off" />
      </div>
      <div class="field" style="flex:0 0 120px">
        <label>Minutes</label>
        <input id="minutesInput" type="number" min="1" max="90" value="10" inputmode="numeric" />
      </div>
    </div>

    <!-- picture source -->
    <div class="seg" id="sourceSeg">
      <button data-src="arasaac" class="on">🔎 Pictogram</button>
      <button data-src="photo">📷 Photo</button>
      <button data-src="emoji">😀 Emoji</button>
    </div>

    <div class="picsource" id="src-arasaac">
      <div class="searchrow">
        <select id="localeSel" style="flex:0 0 120px;height:58px;border-radius:16px;border:2px solid var(--line);background:var(--surface);padding:0 12px">
          <option value="pt">PT</option>
          <option value="en">EN</option>
          <option value="sv">SV</option>
          <option value="es">ES</option>
        </select>
        <input id="searchInput" placeholder="Search a word…" autocomplete="off" />
        <button id="searchBtn">🔎</button>
      </div>
      <div class="grid" id="searchGrid"></div>
      <div class="hint" id="searchHint">Pictograms by ARASAAC (Sergio Palao · Gob. de Aragón · CC BY-NC-SA)</div>
    </div>

    <div class="picsource" id="src-photo" style="display:none">
      <input type="file" id="photoInput" accept="image/*" capture="environment" style="width:100%;padding:14px;background:var(--surface);border:2px dashed var(--line);border-radius:16px" />
      <div class="hint">Use a real photo of the child's own object, place or person — often clearer than a symbol.</div>
    </div>

    <div class="picsource" id="src-emoji" style="display:none">
      <div class="emojis" id="emojiGrid"></div>
    </div>

    <div class="sheet-actions">
      <button class="btn-ghost" id="cancelBtn">Cancel</button>
      <button class="btn-primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<!-- ---------- Timer overlay ---------- -->
<div class="timer" id="timer">
  <div class="t-label" id="tLabel">Activity</div>
  <div class="disc-wrap">
    <div class="disc" id="disc" style="--pct:100"></div>
    <div class="disc-center" id="discCenter"></div>
  </div>
  <div class="t-done-badge">✓</div>
  <div class="t-time" id="tTime">10:00</div>
  <div class="t-actions">
    <button class="t-btn stop" id="tStop">✕ Stop</button>
    <button class="t-btn done" id="tDone">✓ Done</button>
  </div>
</div>

<script>
/* ====================================================================
   Visual Routine — prototype
   - Persistence via localStorage, guarded so it still runs inside
     sandboxes that block storage (falls back to in-memory).
   - ARASAAC integration: search + fetch pictogram, stored as data URL
     so a built routine works offline on the tablet.
==================================================================== */
"use strict";

const ARASAAC_API = "https://api.arasaac.org/api/pictograms";
const ARASAAC_IMG = id => `https://static.arasaac.org/pictograms/${id}/${id}_300.png`;

/* ---------- storage (guarded) ---------- */
const STORE_KEY = "visual-routine-v1";
let memoryFallback = null;
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* storage blocked */ }
  if(memoryFallback) return memoryFallback;
  return null;
}
function saveState(state){
  const s = JSON.stringify(state);
  memoryFallback = state;
  try{ localStorage.setItem(STORE_KEY, s); }catch(e){ /* blocked: memory only */ }
}

/* ---------- seed routine (editable, labels are just examples) ---------- */
function seed(){
  return { activities: [
    { id:uid(), label:"Wake up",   src:"emoji", img:"🛏️", minutes:5,  done:false },
    { id:uid(), label:"Breakfast", src:"emoji", img:"🥣", minutes:15, done:false },
    { id:uid(), label:"Brush teeth",src:"emoji",img:"🪥", minutes:3,  done:false },
    { id:uid(), label:"Play",      src:"emoji", img:"🧸", minutes:20, done:false },
    { id:uid(), label:"Bath",      src:"emoji", img:"🛁", minutes:10, done:false },
  ]};
}
function uid(){ return Math.random().toString(36).slice(2,9); }

let state = loadState() || seed();

/* ---------- DOM refs ---------- */
const $ = s => document.querySelector(s);
const routineEl = $("#routine"), progressEl = $("#progress");
const editBtn = $("#editBtn"), lockBtn = $("#lockBtn"), addBtn = $("#addBtn");

/* ---------- render routine ---------- */
function picMarkup(a){
  if(a.src === "emoji") return `<span>${a.img || "🖼️"}</span>`;
  return `<img alt="" src="${a.img}" onerror="this.replaceWith(document.createTextNode('🖼️'))">`;
}
function currentIndex(){
  return state.activities.findIndex(a => !a.done);
}
function render(){
  const cur = currentIndex();
  routineEl.innerHTML = "";
  if(state.activities.length === 0){
    routineEl.innerHTML = `<div class="empty"><div class="big">🗓️</div>No activities yet.<br>Tap the pencil, then “Add activity”.</div>`;
  }
  state.activities.forEach((a,i)=>{
    const card = document.createElement("div");
    card.className = "card" + (a.done ? " done" : "") + (i===cur ? " now" : "");
    card.innerHTML = `
      <div class="pic">${picMarkup(a)}</div>
      <div class="meta">
        <div class="label">${escapeHtml(a.label || "Activity")}</div>
        <div class="sub">⏱️ ${a.minutes} min</div>
      </div>
      <button class="go" aria-label="Start">▶</button>
      <div class="edit-tools">
        <button class="mini up" aria-label="Move up">▲</button>
        <button class="mini down" aria-label="Move down">▼</button>
        <button class="mini del" aria-label="Delete">🗑️</button>
      </div>
      <div class="check">✓</div>`;
    // child: tap to start
    card.querySelector(".go").addEventListener("click",()=>startTimer(a));
    // edit tools
    card.querySelector(".up").addEventListener("click",()=>move(i,-1));
    card.querySelector(".down").addEventListener("click",()=>move(i,1));
    card.querySelector(".del").addEventListener("click",()=>del(i));
    // tap the card body (in edit) opens the editor
    card.querySelector(".meta").addEventListener("click",()=>{ if(document.body.classList.contains("editing")) openSheet(i); });
    card.querySelector(".pic").addEventListener("click",()=>{ if(document.body.classList.contains("editing")) openSheet(i); });
    routineEl.appendChild(card);
  });
  renderProgress(cur);
}
function renderProgress(cur){
  progressEl.innerHTML = "";
  state.activities.forEach((a,i)=>{
    const d = document.createElement("div");
    d.className = "dot" + (a.done ? " done" : (i===cur ? " now" : ""));
    progressEl.appendChild(d);
  });
}
function escapeHtml(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---------- reorder / delete ---------- */
function move(i,dir){
  const j=i+dir; if(j<0||j>=state.activities.length) return;
  const arr=state.activities; [arr[i],arr[j]]=[arr[j],arr[i]];
  saveState(state); render();
}
function del(i){
  state.activities.splice(i,1); saveState(state); render();
}

/* ---------- edit / lock modes ---------- */
editBtn.addEventListener("click",()=>{
  document.body.classList.toggle("editing");
  editBtn.classList.toggle("active");
});
lockBtn.addEventListener("click",()=>{
  // child lock: hide edit controls; require long-press to unlock
  const locked = document.body.classList.toggle("locked");
  lockBtn.textContent = locked ? "🔓" : "🔒";
  editBtn.style.display = locked ? "none" : "";
  if(locked){ document.body.classList.remove("editing"); editBtn.classList.remove("active"); }
});
// long-press lock button to unlock (so a child can't just tap it back)
let lockTimer=null;
lockBtn.addEventListener("pointerdown",()=>{
  if(!document.body.classList.contains("locked")) return;
  lockTimer=setTimeout(()=>{ document.body.classList.remove("locked"); lockBtn.textContent="🔒"; editBtn.style.display=""; },900);
});
["pointerup","pointerleave","pointercancel"].forEach(ev=>lockBtn.addEventListener(ev,()=>clearTimeout(lockTimer)));

/* ====================================================================
   The editor sheet
==================================================================== */
const sheet=$("#sheet"), sheetTitle=$("#sheetTitle");
const labelInput=$("#labelInput"), minutesInput=$("#minutesInput"), previewPic=$("#previewPic");
let editingIndex=-1;
let draft={ src:"arasaac", img:null };

const EMOJIS=["🛏️","🥣","🍎","🪥","👕","🚽","🛁","🧸","📚","✏️","🚗","🏫","🎨","⚽","🧩","🎵","🍽️","💤","🧼","🚿","☀️","🌙","🧴","👟","🧦","🍌","🥛","🧃","🖥️","📺"];

function openSheet(index){
  editingIndex = (typeof index==="number") ? index : -1;
  if(editingIndex>=0){
    const a=state.activities[editingIndex];
    sheetTitle.textContent="Edit activity";
    labelInput.value=a.label; minutesInput.value=a.minutes;
    draft={src:a.src,img:a.img};
  }else{
    sheetTitle.textContent="Add activity";
    labelInput.value=""; minutesInput.value=10;
    draft={src:"arasaac",img:null};
  }
  setSource(draft.src||"arasaac");
  updatePreview();
  $("#searchGrid").innerHTML=""; $("#searchInput").value="";
  buildEmojiGrid();
  sheet.classList.add("open");
}
function closeSheet(){ sheet.classList.remove("open"); }
addBtn.addEventListener("click",()=>openSheet());
$("#cancelBtn").addEventListener("click",closeSheet);
sheet.addEventListener("click",e=>{ if(e.target===sheet) closeSheet(); });

/* source segmented control */
$("#sourceSeg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; setSource(b.dataset.src);
});
function setSource(src){
  draft.src=src;
  [...$("#sourceSeg").children].forEach(b=>b.classList.toggle("on",b.dataset.src===src));
  $("#src-arasaac").style.display = src==="arasaac"?"":"none";
  $("#src-photo").style.display   = src==="photo"?"":"none";
  $("#src-emoji").style.display   = src==="emoji"?"":"none";
}
function updatePreview(){
  if(draft.src==="emoji") previewPic.innerHTML=`<span>${draft.img||"😀"}</span>`;
  else if(draft.img) previewPic.innerHTML=`<img alt="" src="${draft.img}">`;
  else previewPic.innerHTML=`<span>🖼️</span>`;
}

/* emoji grid */
function buildEmojiGrid(){
  const g=$("#emojiGrid"); g.innerHTML="";
  EMOJIS.forEach(e=>{
    const b=document.createElement("button"); b.textContent=e;
    if(draft.src==="emoji"&&draft.img===e) b.classList.add("sel");
    b.addEventListener("click",()=>{
      draft.src="emoji"; draft.img=e;
      [...g.children].forEach(x=>x.classList.remove("sel")); b.classList.add("sel");
      updatePreview();
    });
    g.appendChild(b);
  });
}

/* photo picker -> data URL */
$("#photoInput").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ draft.src="photo"; draft.img=downscale(r.result); updatePreview(); };
  r.readAsDataURL(f);
});
// simple client-side downscale to keep storage small
function downscale(dataUrl){ return dataUrl; } // placeholder; real downscale done async below
function downscaleAsync(dataUrl, max=400){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=img.width*scale; c.height=img.height*scale;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      try{ res(c.toDataURL("image/jpeg",0.8)); }catch(e){ res(dataUrl); }
    };
    img.onerror=()=>res(dataUrl);
    img.src=dataUrl;
  });
}

/* ARASAAC search */
$("#searchBtn").addEventListener("click",doSearch);
$("#searchInput").addEventListener("keydown",e=>{ if(e.key==="Enter") doSearch(); });
async function doSearch(){
  const q=$("#searchInput").value.trim(); if(!q) return;
  const locale=$("#localeSel").value;
  const grid=$("#searchGrid"), hint=$("#searchHint");
  grid.innerHTML=""; hint.textContent="Searching…";
  try{
    const r=await fetch(`${ARASAAC_API}/${locale}/search/${encodeURIComponent(q)}`);
    if(!r.ok) throw new Error("http "+r.status);
    const data=await r.json();
    if(!Array.isArray(data)||data.length===0){ hint.textContent="No pictograms found. Try another word."; return; }
    hint.textContent="Pictograms by ARASAAC · CC BY-NC-SA";
    data.slice(0,24).forEach(p=>{
      const id=p._id||p.id;
      const t=document.createElement("div"); t.className="thumb";
      t.innerHTML=`<img alt="" loading="lazy" src="${ARASAAC_IMG(id)}">`;
      t.addEventListener("click",async()=>{
        [...grid.children].forEach(x=>x.classList.remove("sel")); t.classList.add("sel");
        hint.textContent="Loading picture…";
        const dataUrl=await urlToDataUrl(ARASAAC_IMG(id));
        draft.src="arasaac"; draft.img=dataUrl||ARASAAC_IMG(id); updatePreview();
        if(!labelInput.value) labelInput.value=q;
        hint.textContent="Picture selected ✓";
      });
      grid.appendChild(t);
    });
  }catch(err){
    hint.textContent="Search failed (offline?). Check connection and try again.";
  }
}
// fetch remote image and store as data URL so the routine works offline
async function urlToDataUrl(url){
  try{
    const r=await fetch(url,{mode:"cors"});
    const blob=await r.blob();
    return await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>res(null); fr.readAsDataURL(blob); });
  }catch(e){ return null; } // CORS/offline: fall back to URL
}

/* save */
$("#saveBtn").addEventListener("click",async()=>{
  const label=labelInput.value.trim()||"Activity";
  const minutes=Math.max(1,Math.min(90,parseInt(minutesInput.value,10)||10));
  let img=draft.img, src=draft.src;
  if(src==="photo"&&img&&img.startsWith("data:")) img=await downscaleAsync(img);
  if(!img){ src="emoji"; img="🖼️"; }
  if(editingIndex>=0){
    Object.assign(state.activities[editingIndex],{label,minutes,src,img});
  }else{
    state.activities.push({id:uid(),label,minutes,src,img,done:false});
  }
  saveState(state); render(); closeSheet();
});

labelInput.addEventListener("input",()=>{}); // reserved

/* ====================================================================
   The concrete visual timer (Time Timer style emptying wedge)
==================================================================== */
const timerEl=$("#timer"), disc=$("#disc"), discCenter=$("#discCenter");
const tLabel=$("#tLabel"), tTime=$("#tTime");
let raf=null, activeActivity=null, endAt=0, totalMs=0, audioCtx=null;

function startTimer(a){
  activeActivity=a;
  totalMs=a.minutes*60*1000; endAt=Date.now()+totalMs;
  tLabel.textContent=a.label;
  discCenter.innerHTML = a.src==="emoji" ? `<span class="emoji">${a.img}</span>` : `<img alt="" src="${a.img}">`;
  timerEl.classList.remove("finished"); timerEl.classList.add("open");
  loop();
}
function loop(){
  const now=Date.now();
  const remain=Math.max(0,endAt-now);
  const pct=totalMs>0 ? (remain/totalMs*100) : 0;
  disc.style.setProperty("--pct",pct.toFixed(2));
  tTime.textContent=fmt(remain);
  if(remain<=0){ finishTimer(); return; }
  raf=requestAnimationFrame(loop);
}
function fmt(ms){
  const s=Math.round(ms/1000); const m=Math.floor(s/60); const ss=s%60;
  return `${m}:${String(ss).padStart(2,"0")}`;
}
function finishTimer(){
  cancelAnimationFrame(raf);
  timerEl.classList.add("finished");
  disc.style.setProperty("--pct",100);
  chime();
}
function stopTimer(){
  cancelAnimationFrame(raf); timerEl.classList.remove("open","finished"); activeActivity=null;
}
function completeActivity(){
  if(activeActivity) activeActivity.done=true;
  saveState(state); render(); stopTimer();
  // if everything done, gently offer reset
  if(state.activities.length && state.activities.every(a=>a.done)){
    setTimeout(()=>{ if(confirm("All done! 🎉  Start the routine again?")){ resetDay(); } },400);
  }
}
$("#tStop").addEventListener("click",stopTimer);
$("#tDone").addEventListener("click",completeActivity);

function resetDay(){ state.activities.forEach(a=>a.done=false); saveState(state); render(); }

/* soft chime at end (Web Audio, no asset needed) */
function chime(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const notes=[523.25,659.25,783.99]; // C-E-G, calm
    notes.forEach((f,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="sine"; o.frequency.value=f;
      const t=audioCtx.currentTime+i*0.18;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.25,t+0.03);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.55);
    });
  }catch(e){ /* audio not available */ }
}

  const icon="data:image/svg+xml;base64,"+btoa(
    `<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512'><rect width='512' height='512' rx='96' fill='#5b8ba0'/><circle cx='256' cy='256' r='150' fill='#eef2f6'/><path d='M256 256 L256 120 A136 136 0 0 1 392 256 Z' fill='#e6a54c'/><circle cx='256' cy='256' r='40' fill='#fff'/></svg>`
  );
  const manifest={ name:"Visual Routine", short_name:"Routine", display:"standalone",
    background_color:"#eef2f6", theme_color:"#eef2f6", start_url:".",
    icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}] };
  const blob=new Blob([JSON.stringify(manifest)],{type:"application/json"});
  const l=document.createElement("link"); l.rel="manifest"; l.href=URL.createObjectURL(blob);
  document.head.appendChild(l);
  const al=document.createElement("link"); al.rel="apple-touch-icon"; al.href=icon; document.head.appendChild(al);
})();
